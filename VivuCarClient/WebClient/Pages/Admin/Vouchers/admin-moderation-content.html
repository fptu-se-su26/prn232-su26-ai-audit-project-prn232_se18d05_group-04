<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiểm duyệt nội dung | VivuCar</title>

  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Be Vietnam Pro','Segoe UI','Arial','sans-serif'], mono: ['SFMono-Regular','Consolas','monospace'] } } } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body data-page="moderation-content" class="min-h-[100dvh] bg-zinc-50 text-zinc-900 font-sans antialiased overflow-x-hidden">
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-shell">
      <div id="headerMount"></div>
      <main class="content">
        <div class="page-heading">
          <div>
            <h1>Kiểm duyệt nội dung</h1>
            <p>Xử lý đánh giá và nội dung bị báo cáo, tách riêng khỏi quản lý người dùng.</p>
          </div>
        </div>

        <section id="contentModerationSummary" class="summary-grid"></section>
        <section id="contentModerationFilters" class="mb-5 flex gap-2 overflow-x-auto whitespace-nowrap"></section>

        <section class="panel">
          <div id="contentModerationEmpty" class="empty-state hidden">
            <h3>Không có nội dung cần xử lý</h3>
            <p>Các nội dung chờ duyệt hoặc bị báo cáo sẽ xuất hiện tại đây.</p>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Loại</th>
                  <th>Nội dung</th>
                  <th>Người gửi</th>
                  <th>Ngày gửi</th>
                  <th>Trạng thái</th>
                  <th>Hành động</th>
                </tr>
              </thead>
              <tbody id="contentModerationTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="contentModerationDetailModal">
    <div class="modal">
      <div class="modal-header"><h2>Chi tiết nội dung</h2><button class="icon-button" type="button" data-close-modal>×</button></div>
      <div id="contentModerationDetail"></div>
      <div class="modal-actions"><button class="btn btn-secondary" type="button" data-close-modal>Đóng</button></div>
    </div>
  </div>

  <div id="modalMount"></div>
  <script src="../assets/js/tailwind-ui.js"></script>
  <script src="../assets/js/constants.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/db-mock.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/admin-moderation-content.js"></script>
</body>
</html>
