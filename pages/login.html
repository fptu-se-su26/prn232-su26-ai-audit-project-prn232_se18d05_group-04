<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | VivuCar</title>

  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit','Segoe UI','Arial','sans-serif'], mono: ['SFMono-Regular','Consolas','monospace'] }, colors: { notion: { bg: '#f7f7f5', surface: '#ffffff', muted: '#fbfbfa', border: '#e6e4df', text: '#1f1f1f' } } } } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/animations.css">

</head>
<body class="login-page" data-public="true">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-mark">VC</span>
      <h1>VivuCar</h1>
      <p>Nền tảng thuê xe tự lái tại Đà Nẵng</p>
    </div>
    <div class="demo-accounts" aria-label="Tài khoản demo">
      <button type="button" data-demo-email="admin@vivucar.vn">admin</button>
      <button type="button" data-demo-email="han.owner@vivucar.vn">car_owner</button>
      <button type="button" data-demo-email="bao.tram@gmail.com">user</button>
    </div>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="admin@vivucar.vn"></div>
      <div class="field"><label for="password">Mật khẩu</label><input id="password" type="password" placeholder="Nhập mật khẩu"></div>
      <label class="check-row"><input id="rememberMe" type="checkbox"> Ghi nhớ đăng nhập</label>
      <div id="errorMessage" class="alert alert-error hidden"></div>
      <div id="loadingState" class="alert hidden">Đang xác thực...</div>
      <button class="btn btn-primary btn-full" id="btnLogin" type="submit">Đăng nhập</button>
    </form>
  </main>
  <script src="../assets/js/tailwind-ui.js"></script><script src="../assets/js/constants.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/db-mock.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
