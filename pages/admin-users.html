<!doctype html>
<html lang="vi"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Người dùng | VivuCar</title>

  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit','Segoe UI','Arial','sans-serif'], mono: ['SFMono-Regular','Consolas','monospace'] }, colors: { notion: { bg: '#f7f7f5', surface: '#ffffff', muted: '#fbfbfa', border: '#e6e4df', text: '#1f1f1f' } } } } };

</head><body data-page="users" class="min-h-[100dvh] bg-[#f7f7f5] text-[#1f1f1f] font-sans antialiased overflow-x-hidden">
  <div class="app-shell"><div id="sidebarMount"></div><div class="main-shell"><div id="headerMount"></div><main class="content">
    <div class="page-heading"><div><h1>Quản lý người dùng</h1><p>Dữ liệu bám bảng `users`: role và `is_blocked` là nguồn trạng thái tài khoản.</p></div></div>
    <section class="toolbar toolbar-admin-users"><input id="searchUserInput" placeholder="Tìm theo tên hoặc email"><select id="roleFilter"><option value="">Tất cả vai trò</option><option value="admin">Quản trị viên</option><option value="car_owner">Chủ xe</option><option value="user">Khách thuê</option></select><select id="blockedFilter"><option value="">Tất cả trạng thái</option><option value="false">Đang hoạt động</option><option value="true">Đã khóa</option></select><button class="btn btn-primary" id="btnApplyFilter">Lọc</button><button class="btn btn-secondary" id="btnResetFilter">Đặt lại</button></section>

  <div class="modal-backdrop" id="userStatusModal"><div class="modal"><div class="modal-header"><h2 id="userStatusTitle"></h2><button class="icon-button" type="button" data-close-modal>×</button></div><p id="userStatusText" class="muted"></p><label id="blockReasonWrap">Lý do khóa<textarea id="blockReason" placeholder="Nhập lý do khóa tài khoản"></textarea></label><div class="modal-actions"><button class="btn btn-secondary" id="btnCancelUserStatus">Hủy</button><button class="btn btn-primary" id="btnConfirmUserStatus">Xác nhận</button></div></div></div>
